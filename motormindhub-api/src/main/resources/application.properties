spring.application.name=Api

# Datasource (PostgreSQL) - valori reali forniti via variabili d'ambiente in produzione (SDD 3.2)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/motormindhub}
spring.datasource.username=${DB_USERNAME:mmh}
spring.datasource.password=${DB_PASSWORD:mmh}

# Lo schema e' governato da Flyway, non da Hibernate (RNF4.2 - tracciabilita' delle modifiche al DB)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (RNF2.7, RNF9.2) - access token a breve durata (1800000 ms = 30 minuti), secret iniettato via
# variabile d'ambiente in produzione.
security.jwt.secret=${JWT_SECRET:change-this-secret-in-production-please-0123456789ABCDEF}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Refresh token opaco (RNF9.2) - 14 giorni, nella finestra 7-30 indicata dall'SDD 3.4.
security.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:14}

# Rate limit per email su /auth/login (LoginRateLimiter): livello aggiuntivo rispetto al blocco
# per-account di RNF2.6 (5 tentativi falliti), pensato contro il credential stuffing distribuito
# su piu' IP verso lo stesso account - qui si contano tutti i tentativi, non solo i falliti.
security.login-rate-limit.capacity-per-minute=${LOGIN_RATE_LIMIT_CAPACITY_PER_MINUTE:10}

# Rate limit per IP sugli endpoint pubblici (RateLimitFilter, cfr. SecurityConfig). Default = soglie
# di produzione. La suite e2e (Playwright, motormindhub-web/e2e) genera piu' di 60 GET /categorie o
# /articoli al minuto anche in esecuzione seriale senza concorrenza (isolato con una riproduzione
# minimale fuori da Playwright): l'ambiente e2e (CI e avvio locale del backend per Playwright) deve
# impostare queste due env var molto piu' alte, non modificare i default qui.
security.rate-limit.permissive-capacity-per-minute=${RATE_LIMIT_PERMISSIVE_CAPACITY_PER_MINUTE:60}
security.rate-limit.strict-capacity-per-minute=${RATE_LIMIT_STRICT_CAPACITY_PER_MINUTE:8}

# Email (GestioneNotifiche, ODD 2.6) - in sviluppo il server SMTP e' Mailpit (docker-compose.yml,
# localhost:1025), che accetta qualunque connessione senza autenticazione ne' TLS; in produzione le
# credenziali di un vero relay SMTP vanno fornite via variabili d'ambiente.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Timeout espliciti (RNF9.1): se il relay non risponde entro pochi secondi e' meglio fallire
# esplicitamente (loggato in GestioneNotifiche.invia, eventualmente ritentabile) che bloccare a
# tempo indeterminato un thread @Async (AsyncConfig).
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITETIMEOUT:5000}

app.mail.from=${MAIL_FROM:no-reply@motormindhub.it}
# Casella interna del ruolo Gestore Utenti (non di un singolo operatore: nessun sottosistema traccia
# "chi" ha eseguito un'azione amministrativa, cfr. LogAzioneAmministrativa) per le notifiche in copia
# richieste da UC_25 passo 5 (conferma cancellazione account).
app.mail.notifiche-interne-gestore-utenti=${MAIL_GESTORE_UTENTI:gestore-utenti@motormindhub.it}
# Base URL del front-end Next.js (SDD 3.2, repo separato): usata per costruire i link cliccabili
# nelle email (verifica email, recupero password, invito autore, sblocco account - RNF9.3). Le route
# esatte non sono documentate in RAD/ODD/mockup: nomi scelti in modo leggibile, da allineare con il
# front-end quando le route reali saranno definite.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Cloud Storage (SDD 3.2, pattern Strategy - CloudStorageService/CloudinaryStorageService): nessun
# default letterale, a differenza di JWT_SECRET/MAIL_*. CloudinaryConfig valida esplicitamente che
# queste tre proprieta' siano valorizzate e fa fallire l'avvio dell'applicazione se mancano, invece
# di lasciar partire un provider che fallirebbe silenziosamente/in modo criptico al primo upload.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Ceiling globale sul multipart, difesa aggiuntiva rispetto ai limiti applicativi differenziati per
# scopo di ImageUploadValidator (foto profilo/copertina articolo, cfr. GestioneUtenti/GestioneArticoli):
# leggermente sopra il piu' alto dei due (5MB), cosi' che un payload molto oltre soglia venga scartato
# dall'infrastruttura multipart di Spring (413) prima ancora di essere bufferizzato in memoria.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
