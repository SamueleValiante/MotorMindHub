spring.application.name=Api

# Datasource (PostgreSQL) - valori reali forniti via variabili d'ambiente in produzione (SDD 3.2)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/motormindhub}
spring.datasource.username=${DB_USERNAME:mmh}
spring.datasource.password=${DB_PASSWORD:mmh}

# Lo schema e' governato da Flyway, non da Hibernate (RNF4.2 - tracciabilita' delle modifiche al DB)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (RNF2.7, RNF9.2) - access token a breve durata, secret iniettato via variabile d'ambiente in produzione
security.jwt.secret=${JWT_SECRET:change-this-secret-in-production-please-0123456789ABCDEF}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Email (GestioneNotifiche, ODD 2.6) - in sviluppo il server SMTP e' Mailpit (docker-compose.yml,
# localhost:1025), che accetta qualunque connessione senza autenticazione ne' TLS; in produzione le
# credenziali di un vero relay SMTP vanno fornite via variabili d'ambiente.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.mail.from=${MAIL_FROM:no-reply@motormindhub.it}
# Casella interna del ruolo Gestore Utenti (non di un singolo operatore: nessun sottosistema traccia
# "chi" ha eseguito un'azione amministrativa, cfr. LogAzioneAmministrativa) per le notifiche in copia
# richieste da UC_25 passo 5 (conferma cancellazione account).
app.mail.notifiche-interne-gestore-utenti=${MAIL_GESTORE_UTENTI:gestore-utenti@motormindhub.it}
# Base URL del front-end Next.js (SDD 3.2, repo separato): usata per costruire i link cliccabili
# nelle email (verifica email, recupero password, invito autore, sblocco account - RNF9.3). Le route
# esatte non sono documentate in RAD/ODD/mockup: nomi scelti in modo leggibile, da allineare con il
# front-end quando le route reali saranno definite.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
